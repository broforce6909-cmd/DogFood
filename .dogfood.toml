# Dogfood Hackathon — submission manifest.
#
# One file, two readers. The organizers' checker (`python3 run.py .dogfood.toml`)
# reads exactly four tables: [portal], [tiers], [auth] and [routes], and ignores
# everything else. [evidence], [bonus] and [meta] below are ours: the richer
# record of what was built and how it was checked.
#
# Tiers are claimed here ONLY once they are built and verified. Overclaiming
# costs more than the tier is worth; this file stays honest.
#
# Keep every value on ONE line and free of the hash character: run.py falls back
# to a small line-based TOML parser on Python older than 3.11, and that parser
# handles neither multi-line arrays nor a hash inside a string.

[portal]
# The API. Every route below is an /api route; the Next.js UI on :3000 is a
# client of it and does not proxy it.
base_url = "http://localhost:8000"

[tiers]
# Exactly what run.py verifies, and nothing more. It has checks for T1 and T2 and
# none for T3 or T4, so claiming either could only ever print as "claimed but not
# verified". T3 and T4 are built and tested by us; that record is [evidence] below.
claimed = ["T1", "T2"]
pitch = "A self-hostable, API-first hackathon submission and judging portal — one command to a seeded, working install."

[auth]
# Printed by the api container on every boot (`docker compose logs api`), in
# this exact shape, by app/seed_fixtures.py. The values are derived from
# SESSION_SECRET, so they are the same after `docker compose down -v && up`.
# judge_a and judge_b are two of the fixture's own judges, both track judges on
# the Security track, both of whom reviewed "Glass Signal" (prj_01).
organizer   = "Cookie: dogfood_session=org_90e565803f7212ec29909b95"
judge_a     = "Cookie: dogfood_session=jdg_a_a89a539fac03c5b8e0978b04"
judge_b     = "Cookie: dogfood_session=jdg_b_ba8b12ca5e40251fbb9238d6"
participant = "Cookie: dogfood_session=prt_26172d5dee69916d1bdd6ea2"

[routes]
# The fixture event, "Sample Hack 2026" (slug sample-hack-2026): 40 projects, 30
# judges, 123 ballots, submissions closed as the file says.
# The gallery is that event's own page-one gallery, the one the UI fetches.
gallery      = "/api/gallery?event=sample-hack-2026"
# The participant submitting their own team's project (priya1 owns "Glass Signal")
# after the close. Chosen over POST /api/submissions on purpose: that route needs a
# team_id and a name, so run.py's title/summary body is rejected as malformed (422)
# before the deadline is ever consulted, and the check would pass for the wrong
# reason. This route takes no body, so the request reaches the deadline check and
# is refused there: 409 "The submission deadline has passed".
submit       = "/api/submissions/052ba364-1474-5e8b-a422-7f30cba5e813/submit"
# A ballot is the unit of isolation here: judge_a's ballot on "Glass Signal".
# judge_a reads it (200). The same URL is what judge_b, who reviewed the same
# project, must be refused (403), and a participant too.
judge_scores = "/api/judging/assignments/5a1e2546-e0c2-535e-b89a-45725f777eec"
peer_scores  = "/api/judging/assignments/5a1e2546-e0c2-535e-b89a-45725f777eec"
csv_export   = "/api/events/sample-hack-2026/export/results.csv"

# ---------------------------------------------------------------------------
# Below this line: ours. run.py does not read it.
# ---------------------------------------------------------------------------
#
# Evidence behind the claims above, stated so it can be checked rather than
# trusted:
#
#   * A from-scratch install works: as its own compose project on an empty volume
#     (built with `up --build`, then torn down with `down -v`) it ran all 21
#     migrations to head, seeded, loaded the organizers' fixtures, printed logins
#     identical to the ones committed above, came up healthy, and passed all seven
#     of run.py's checks. The browser E2E suite was NOT run against that fresh stack
#     in this pass; it was run against the live one (below).
#   * Our own suite: 840 passed, 1 skipped (841 collected), 0 failed, on the final
#     code of this pass, run file by file (41 files) against the dockerized
#     Postgres. The split is a limit of the laptop it was run on (the full suite
#     exhausts its memory in one go), not a property of the suite. 18 of the 840 are
#     tests/test_fixture_loader.py: the fixtures loader and the seven acceptance
#     checks, including the deadline control and the judge-isolation probe. The one
#     skip is `tests/test_certificate_render.py`'s real-render test, which needs
#     WeasyPrint's native Pango/GObject libraries — present in the Docker image, not
#     on every bare host running the suite outside it; see that file's `skipif`. See
#     README.md#tests.
#   * Browser E2E: 12 Playwright tests in 10 spec files (`e2e/`), 12 passed, 0 failed
#     against the live stack in this pass, after the fixture event was added to its
#     database (2.5 minutes). Not re-run against the from-scratch stack this pass
#     (see above). Single-worker here, for the same laptop reason; CI runs two.
#   * 137 endpoints, OpenAPI at /openapi.json. Every UI action goes through
#     them — the count was re-read from the running API's own OpenAPI document
#     on the from-scratch stack; see [bonus.api_first].
#
#   T1 — checked live with curl rather than a browser: the deadline holds on a
#   past-deadline event (409), another team's draft is 404 rather than 403, a team
#   invite token is 403 to non-members, the organizer-only user list is 403 to a
#   participant. A later pass closed a real gap in this tier rather than one this
#   file invented after the fact: self-registration was already correctly
#   hardcoded to `participant` with no `role` field on the form at all, but there
#   was no *admin-side* path to create a judge or organizer account directly —
#   promoting one required an existing self-registered account first, which is
#   backwards for someone who should never see the public registration form.
#   `POST /api/users` (admin-only) now provisions one directly, with a generated
#   password emailed rather than typed by the admin and never returned in the
#   API response, the audit summary, or any log line —
#   `test_the_generated_password_never_appears_in_the_audit_log_or_response`
#   asserts exactly that. `test_self_registration_cannot_produce_a_judge_or_
#   organizer_role` posts `role: "admin"` at the public registration endpoint,
#   a field it does not declare, and asserts it is silently ignored.
#
#   T2 — same method: a judge reading a peer's ballot is 403, a track judge
#   reading another track's ballot is 403, the assignment grid and the aggregate
#   are both 403 to a judge, and an ORGANIZER writing a judge's score is 403 —
#   the one place staff privilege stops. `tests/test_judging_isolation.py` was
#   written before the feature and asserts all of it over HTTP with a bearer
#   token. Normalization is demonstrated, not asserted: `python
#   scripts/normalization_proof.py` prints raw scores, normalized scores and the
#   rank movement on the seeded fixtures. Scoped per track since a later pass
#   (JUDGING.md §3): a judge who reviews multiple tracks with no restriction is
#   normalized separately within each, not averaged across tracks they used the
#   scale differently on. A more recent pass moved `scores.value` off a plain
#   integer onto `numeric(5, 2)` so a judge scores in 0.1 steps instead of only
#   whole numbers — `raw_score`/`normalize` already cast every value through
#   `float()`, so the normalization method itself did not change at all, and
#   `scripts/normalization_proof.py`'s own output on the seeded fixture is
#   byte-for-byte identical before and after, which is the actual proof that
#   moving real, already-seeded discrete scores onto the continuous scale
#   changed no ranking, no calibration, and no rank-movement narrative already
#   written down in JUDGING.md §5.
#
#   T3 — 35 abuse tests in `tests/test_voting_abuse.py`, written before the
#   feature, one named attack per test. Then the UI exercised end to end with
#   **JavaScript disabled** (31 checks, all passing), posting to the real Next.js
#   server actions pulled out of the rendered HTML: the ballot (cast 5+3 votes =
#   34 credits, revise, over-budget refused whole with nothing written, withdraw),
#   comments (post, moderate, gone from the public page), the tally (hidden to the
#   public while voting is open, visible to the organizer, public on the finished
#   event) and the audit page (sentences, 404 to a participant).
#
#   T4 — 142 tests across signing (16), webhooks (`test_webhooks.py` 34 +
#   `test_webhook_topics_are_wired.py` 11 = 45; the delivery-scheduling and
#   embeddable-widget tests are in `test_t4_integration.py`, 13 more),
#   certificates (issuance 20, rendering 9, the ownership-gated lookup 13 = 42)
#   and import/export (26), plus 34 live checks from an earlier pass against
#   the running stack. (An earlier revision of this line quoted 119; the figures
#   above are the current per-file counts, and they had drifted.)
#     - the SSRF guard refuses localhost, `db`, `169.254.169.254` and private
#       ranges through the real HTTP API, and runs again at delivery because DNS
#       can be re-pointed;
#     - a seeded record verifies with no auth header at all, and its Ed25519
#       signature recomputes from the bytes the endpoint returns against the
#       public key at /api/signing/public-keys;
#     - the embed widget renders, hides drafts, and runs no script of its own;
#     - export -> import -> export is byte-identical, a foreign event's rows are
#       refused rather than written, and the import is audited.
#   A later pass found and closed a real gap in this tier: `GET
#   /submissions/{id}/certificates` — the lookup a participant's own
#   certificate wizard uses to find the record naming them — answered with no
#   authentication at all, so anyone who could search up a project in the
#   public gallery could list every certificate code issued for it, and a code
#   is the one thing `GET /api/certificates/{code}` needs to hand back the
#   signed document. `tests/test_certificate_access.py` writes the isolation
#   test first, per the instruction that found it: a stranger gets 403, an
#   anonymous caller gets 401, a real team member sees only their own and their
#   team's records, and a downloaded code still verifies with no account
#   afterward — the fix is scoped to *discovery*, not to the publicly-verifiable
#   guarantee this tier was built to keep. The same pass made judging and
#   organizing certificates admin-issued rather than self-service
#   (`POST /events/{slug}/certificates/issue-for-user`, staff-only, naming the
#   subject directly), on the reasoning that neither a judge nor an organizer
#   requests their own record the way a participant does theirs.
#
#   Since the last full self-audit -- what landed, and what each claim rests on:
#
#   * Scale. The load pass went another order of magnitude up (1,200 submissions,
#     520 judges, 54,600 votes, 110,000 chained audit entries) with the tool
#     committed (`scripts/load_test/`), and real p50/p95/p99, CPU and memory are in
#     ARCHITECTURE.md "Performance". It found three bottlenecks and fixed them (audit
#     verify hydrating every row as an ORM object, the default 15-connection pool,
#     the vote tally's unnecessary ORM work). Caveats stated there, not here: the
#     figures are from one Docker Desktop laptop with roughly 2x run-to-run variance,
#     and the ~8 s that remains on `GET /api/audit/verify` at 110k rows is the cost
#     of the SHA-256 chain itself.
#   * Judge calibration (optional, beyond the tier list). Practice projects with
#     organizer-set expected scores; the report flags harsh/generous judges. Never
#     counts toward a result, and a judge is never shown an expected score
#     (`tests/test_calibration.py`, `e2e/tests/calibration.spec.ts`, JUDGING.md §10).
#     It is a noisy flag for a conversation, and JUDGING.md says so.
#   * Admin levels (owner / manager / auditor). `Role.ADMIN` is refined, not
#     replaced; existing admins are owners. Read-only is enforced twice (a verb list
#     in `check_access` and a method check before any handler runs), the last owner
#     cannot demote themselves (`tests/test_admin_levels.py`, ARCHITECTURE.md "Admin
#     levels"). Full isolation suites were re-run after this change specifically.
#   * Event archival. An archived event is frozen -- every non-read verb refused for
#     the event and everything it owns, checked as a full verb-by-resource matrix --
#     and leaves the default lists, but its gallery, results and certificates keep
#     working (`tests/test_event_archival.py`, ARCHITECTURE.md "Event archival").
#     Deleting an archived event is refused on purpose: unarchive first.
#   * Sign-in role tabs are a check, not decoration: an explicitly chosen tab that
#     does not match the account's real role is refused with a message and no
#     session (README.md, `tests/test_auth_api.py`). This reverses what an earlier
#     revision of the README claimed ("cosmetic only").
#   * Certificates now sign the project name on participation records, show the
#     signature check on the document, and render without a doubled "Team". The
#     public `WEB_BASE_URL` (which the QR code depends on) is documented in
#     OPERATIONS.md; the default is localhost and is wrong for a real deployment.
#
#   Corrections made in this pass, because the numbers had drifted: endpoints 103 ->
#   137, audit verbs 34/45 -> 50, webhook topics 10 -> 13, and the seeded past event
#   `raptors-summer` was being called "archived" when it is only finished (the
#   archival feature did not exist when that was written).
#
# The organizers' acceptance suite (run.py) and dataset (fixtures.json) are now in
# this repository, and acceptance-report.txt is the checker's saved output. It has
# checks for T1 and T2 only, and all seven pass, on the running stack and on a
# from-scratch install (empty volume: 21 migrations, seed, fixtures load). `claimed`
# at the top is exactly that, not what we believe we built: T3 and T4 are built, and
# are recorded under [evidence] rather than claimed, because the checker cannot
# verify them. If it disagrees with us this file follows it, downward included.
#
# What each of the seven rests on, and what it does not prove (OPERATIONS.md has more):
#
#   * "closed event refuses submissions" -- run.py's title/summary body cannot create
#     a project here (there is no team_id in it), so pointed at POST /api/submissions
#     it would pass on a 422 that never reached the deadline. It is pointed at the
#     per-submission submit action instead, which answers 409 "The submission
#     deadline has passed"; a control shows that same action succeeds on an open event,
#     and tests/test_fixture_loader.py shows it allowed an hour before the close and
#     refused a second after it. The close date is the fixture's own.
#   * "project from fixtures shown" -- passes on page one of the fixture event's own
#     gallery (24 of its 40 projects; of the checker's three titles only "Deep
#     Compass" is on it, and one is enough). The unfiltered cross-event gallery would
#     still fail it: it takes turns between events, which puts 7 fixture projects on
#     page one, but the checker's three titles are on pages 3, 2 and 2 of that view.
#   * "judge cannot see peer scores" -- 403 for judge_b on judge_a's ballot, where
#     judge_b reviewed the same project and reads their own ballot fine. Sweeping every
#     GET route reachable as judge_b (54) found none carrying judge_a's ballot id,
#     name or email, and breaking the ownership check in a test makes this exact
#     probe return 200 with judge_a's data, so the check is not vacuous.
#   * The other four (public gallery, judge reads own ballot, participant refused,
#     CSV export) pass on the plain reading, with a session-validity control for the
#     refusals: each token authenticates as the account it claims to be.
#
# Fixture adaptations (one submission per team, unique team names, judges listing two
# tracks) are printed at every boot and listed in OPERATIONS.md; none is silent.

[evidence]
# Built, and covered by our own suite (the notes above). That is NOT the same as
# verified by the organizers' run.py, which has checks for T1 and T2 only.
t1_core = true       # auth, roles, events, teams, submissions, gallery
t2_judging = true    # assignment, weighted rubric, role isolation, normalization
t3_public = true     # community voting, comments, anti-abuse, hidden results
t4_stretch = true    # REST API + webhooks, certificates, signed records, embeds

[bonus]
# Implemented, and proved on the fixture data rather than described: the method,
# the σ→0 rule for the judge who marks everything a 3, shrinkage for small n, and
# a generated before/after ranking. JUDGING.md §3 and §5. Re-verified after
# scoring moved to a continuous 0.1-step scale: the proof script's output on the
# seeded (still whole-number) fixture is unchanged, because every existing
# integer score converts losslessly onto the new scale.
#
# A later pass also put the proof on the public landing page, not only in this
# file and JUDGING.md: `frontend/app/normalization-demo.tsx` is the same six
# projects and the same raw/normalized numbers `scripts/normalization_proof.py`
# prints, toggleable, so a visitor sees the rank swap happen rather than reading
# a claim about one. No score counter, no code change to the method itself.
normalization_proof = true

# THREAT-MODEL.md, covering the T4 surface it was held back for: webhook SSRF
# (§6), signed-record forgery (§7 -- Ed25519 with real key rotation, so the
# single-key limitation this section once named is closed and the section says
# so), the embed's deliberate framing decision (§8), and import/export
# including the formula-injection vector the document surfaced and the code
# neutralises (§9). §7 also now names the certificate-discovery gap found and
# closed in a later pass (see the T4 note above) rather than leaving it
# implicit in a test file nobody reading the threat model would find. §10's
# "what we did not stop" list is maintained, not written once: entries close as
# fixes land and new ones get added when a self-audit finds something nobody
# had named yet. Claimed because the honest, current list is the deliverable,
# not a snapshot of it.
threat_model = true

# Bradley-Terry (MM) over pairwise comparisons, additive to the scored rubric
# rather than a replacement -- app/pairwise.py, three routes (GET
# .../pairwise/next, POST .../compare, GET .../results), 47 tests across
# test_pairwise.py (pure maths: ties, disconnected components, cold start, "a
# judge who never compares two specific projects") and test_pairwise_api.py
# (access control, eligibility, the audit trail). Proof generated against the
# seeded fixtures by scripts/pairwise_proof.py, in JUDGING.md §6.
pairwise_mode = true

# Claimed after an actual audit, not assumed from the endpoint count, and
# re-audited for this pass specifically because every session since the last
# audit added new frontend surface (role-based dashboards, an admin account-
# provisioning form, admin-issued judge/organizer certificates, an admin
# announcements panel). Method, unchanged: every `/api/...` path called from
# the frontend (both server actions in app/actions.ts and page reads, template
# strings and `PUBLIC_BASE}/api/...` links included) was extracted and checked
# against the OpenAPI document's own path list. Every one matched, including
# every path added since the last audit -- no page or form calls a route that
# is not in the published spec, and none of the frontend's own internal
# Next.js routes stand in for a real API call.
#
# The original audit found one real gap rather than a clean pass on the first
# look: the README's own sign-in table claimed the admin account could "see"
# role assignment and account deactivation, and `backend/app/routers/users.py`
# fully implements both -- but no frontend page called any of them. The claim
# was about the API being complete relative to the UI, and here the API had
# *more* than the UI did, which is a different problem (the README overselling
# what a fresh clone shows) but the same root cause this whole pass kept
# finding: a feature's two sides drifting apart with nobody checking. Closed by
# building `frontend/app/admin/page.tsx` against the existing, already-tested
# endpoints. A later pass found the identical shape of gap a second time: the
# organizer's own event page has had a working Announcements panel since
# Phase 6, but nothing on `/admin` could reach it, so an admin had to already
# know to navigate to `/organizer/{slug}` to post one. Closed the same way --
# an event picker plus the same panel, backed by the same, already-tested
# `POST /api/events/{slug}/announcements` -- rather than left as a second,
# undocumented instance of the pattern the first fix was supposed to prevent.
api_first = true

[meta]
license = "MIT"
stack = ["FastAPI", "Next.js", "PostgreSQL", "Docker Compose"]
status = "All four tiers built, plus a scale pass, judge calibration, three admin levels, event archival and role-checked sign-in tabs. Claimed: T1 and T2, exactly what the organizers' run.py verifies (7 of 7 checks pass, on the live stack and on a from-scratch install). T3 and T4 are built and covered by our own tests, and are recorded under [evidence] rather than claimed. Backend suite 840 passed / 1 skipped (841 collected), browser E2E 12/12, both run on the final code of this pass. No further features are planned: remaining work is demo material. See README.md's \"What it does not do yet\" for the honest remainder."
