[tool.ruff]
# 100, not Black's 88 or PEP 8's 79: this codebase's docstrings carry real
# argument (the "why", not the "what"), and 88 columns wraps a normal
# explanatory sentence far more often than is worth the churn. 100 is wide
# enough that the handful of genuinely long lines (~17, out of the whole
# tree) are worth wrapping by hand rather than the rule being worth loosening
# further.
line-length = 100
target-version = "py312"

# Autogenerated by `alembic revision --autogenerate`, reviewed by hand once at
# the time it was written, and never touched again -- linting it is linting
# Alembic's own template, not this project's code.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# A deliberately narrow selection over ruff's full catalogue, chosen for what
# each category actually catches in a FastAPI + SQLAlchemy + Pydantic
# codebase like this one, not "everything ruff offers":
#   E, F   - pyflakes/pycodestyle: real bugs (unused imports, undefined
#            names, shadowed builtins) and the formatting pycodestyle itself
#            defines, not a second opinion on top of a formatter this project
#            does not run.
#   I      - import sorting. Cheap to keep consistent, annoying to review by
#            eye across ~30 router files.
#   B      - flake8-bugbear: mutable default arguments, bare excepts, loop
#            variables captured by a closure -- the class of bug that passes
#            every test and breaks in production.
#   UP     - pyupgrade: this project targets 3.12+, so no reason to keep
#            patterns (`Optional[X]` over `X | None`, old-style `%`-free
#            super() calls) the codebase has already moved past everywhere
#            else.
select = ["E", "F", "I", "B", "UP"]

# B008: FastAPI's `Depends(...)` and `Query(...)` as a default argument value
# is the framework's own documented pattern, not the "don't call a function
# in a default argument" bug bugbear is built to catch -- every route in this
# codebase does it, correctly, on purpose.
#
# UP042: would rewrite every `class Foo(str, enum.Enum)` (12 of them, across
# the whole model layer -- AuditAction, AssignmentStatus, WebhookEvent, Role,
# and more) to `class Foo(enum.StrEnum)`. Mechanically similar, but StrEnum's
# `__str__` returns the bare value instead of `Foo.MEMBER`, which is a real
# behavioural difference this codebase's `_pg_enum()` bridge to Postgres and
# every `f"{enum_member}"` log/summary string would need auditing against --
# a one-line rule fix is not worth reopening twelve working enum definitions
# that 597 passing tests already cover under the current pattern.
#
# UP046: would rewrite `pagination.Page(BaseModel, Generic[ItemT])` to PEP
# 695's `class Page[ItemT](BaseModel)`. Newer syntax with less-proven Pydantic
# v2 generic-model support behind it; the existing `Generic[ItemT]` form is
# the one Pydantic's own docs still lead with.
ignore = ["B008", "UP042", "UP046"]

