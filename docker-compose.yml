name: dogfood

# One command to a seeded, working portal:  docker compose up
# Services:
#   db  - PostgreSQL 16 (local volume, no hosted dependency)
#   api - FastAPI backend on :8000
#   web - Next.js frontend on :3000
#
# No cloud account, no API key, no external service. Package registries are
# only touched the first time images build; the running portal is offline-capable.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # Host port is overridable: a laptop with a native Postgres already on
      # 5432 would otherwise shadow this one, and the failure looks like a
      # password error rather than a port conflict. `DOGFOOD_DB_PORT=55432
      # docker compose up` gets out of the way. The in-network address that api
      # uses is always db:5432 and is unaffected.
      - "${DOGFOOD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      # ---------------------------------------------------------------- #
      # DEV-ONLY SECRETS -- these two values are committed, public, and known
      # to anyone who has cloned this repo. That is correct for this file:
      # docker-compose.yml is the "works with zero configuration" path for a
      # laptop or a judge's install. It is NEVER correct for a deployment that
      # holds a real event's data -- see backend/.env.example for what to set
      # instead, and app/config.py's Settings.model_post_init, which refuses
      # to start with ENVIRONMENT=production while either is still this value.
      # ---------------------------------------------------------------- #
      DATABASE_URL: postgresql+psycopg://dogfood:dogfood@db:5432/dogfood
      SESSION_SECRET: dev-secret-change-me-in-production
      # Certificates are signed with Ed25519 (asymmetric), not a shared secret --
      # see app/config.py and app/signing.py for why, and for the fixed dev
      # keypair backend/app/config.py falls back to when these are unset. A real
      # deployment sets SIGNING_ACTIVE_PRIVATE_KEY_PEM to its own generated key.
      # SIGNING_ACTIVE_KID: dev-2026-01
      # SIGNING_ACTIVE_PRIVATE_KEY_PEM: |
      #   -----BEGIN PRIVATE KEY-----
      #   ...
      #   -----END PRIVATE KEY-----
      # ---------------------------------------------------------------- #
      CORS_ORIGINS: http://localhost:3000
      # Only used to build clickable team invite links.
      # Overridable: `WEB_BASE_URL=https://portal.example.org docker compose up`.
      # See OPERATIONS.md, "The public URL" -- certificate QR codes depend on it.
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      SEED_ON_START: "true"
      # The organizers' published dataset, mounted read-only from the repo root so
      # the portal and the acceptance suite (`run.py`) read the very same file.
      FIXTURES_PATH: /fixtures/fixtures.json
      # ENVIRONMENT is deliberately left unset here (defaults to "development"):
      # setting it to "production" against the dev secrets above is exactly the
      # misconfiguration Settings.model_post_init exists to refuse.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Mask a developer's host virtualenv; the image has its own site-packages.
      - /app/.venv
      # Outside /app on purpose: /app is itself a bind mount of ./backend.
      - ./fixtures.json:/fixtures/fixtures.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  web:
    build: ./frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Browser-facing base URL (used by client components)
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      # In-cluster base URL (used by Next.js server-side fetches)
      API_INTERNAL_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    # No bind mount: the image is now a built, standalone production server
    # (frontend/Dockerfile), not the source tree run through `next dev`. A
    # source bind mount would overwrite the built `server.js` with the raw,
    # unbuilt project and the container would not start.
    healthcheck:
      # wget, not curl -- the node:20-alpine image ships busybox's wget and
      # nothing else. `-q -O -` writes the page to stdout instead of a file, so
      # nothing needs cleaning up. `127.0.0.1`, not `localhost`: this image's
      # `/etc/hosts` resolves `localhost` to `::1` before `127.0.0.1`, and the
      # standalone server (`HOSTNAME=0.0.0.0` in frontend/Dockerfile) binds only
      # the IPv4 wildcard -- `wget http://localhost:3000` picked the AAAA
      # answer first and got connection refused against a server that was
      # actually up and serving on IPv4 the whole time.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  dbdata:
